# @package _global_
# F2 任务覆盖（XPT 先进偏滤器）。
# 通过 @package _global_ 将本文件内容合并到根层级，覆盖 base.yaml。

task: F2
ports: "2223"
num_envs: 32
max_steps: 500
shot_id: "13844_500"
output_dir: f2_direct

shot_groups:
  divertor_start:
    - "13844_500"
    - "13844_600"
  limiter_start:
    - "15892_400"
    - "15892_500"

target:
  reference_mode: trajectory  # trajectory | hold_initial
  reference_variants_enabled: false
  default_reference_path: null
  reference_variants_path: null

features:
  history_steps: 4

actions:
  mode: absolute

reset_perturbation:
  enabled: true
  apply_mode: all
  fix_reset_params: true
  signeo_scale_range: [0.95, 1.05]
  bp_scale_range: [0.95, 1.05]
  q0_scale_range: [0.95, 1.05]

reward_weights:
  use_competition_score: false
  ip_score: 6.0
  lcfs_score: 6.0
  main_x_dist_score: 4.0
  main_x_psi_score: 4.0
  second_x_psi_score: 3.0
  second_x_dist_score: 4.0
  strike_dist_score: 3.0
  failure_penalty: -5.0
  coil_current_exceed_limit_penalty: -5.0
  score_lower_bound: false

ppo:
  total_timesteps: 32768000
  learning_rate: 1.0e-4
  n_steps: 256

# --- WandB ---
wandb:
  enabled: true
  project: f2_control
  entity: null
  tags: []