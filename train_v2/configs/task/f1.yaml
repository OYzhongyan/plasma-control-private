# @package _global_
# F1 任务覆盖（偏滤器 divertor，semifinal_dense_v2 reward）。
# 通过 @package _global_ 将本文件内容合并到根层级，覆盖 base.yaml。

task: F1
ports: "2223"
num_envs: 64
max_steps: 300
shot_id: "13844_500"
output_dir: f1_direct

shot_groups:
  divertor_start:
    - "13844_500"
    - "13844_600"

target:
  reference_mode: trajectory        # trajectory | hold_initial
  reference_variants_enabled: false
  default_reference_path: null
  reference_variants_path: null

features:
  history_steps: 4

actions:
  mode: absolute

reset_perturbation:
  enabled: true
  apply_mode: all
  fix_reset_params: true
  signeo_scale_range: [0.95, 1.05]
  bp_scale_range: [0.95, 1.05]
  q0_scale_range: [0.95, 1.05]

reward_weights:
  use_competition_score: false
  failure_penalty: -5.0
  alive_offset: 1.0
  ip_score: 0.3
  lcfs_score: 0.7
  # ip_error_soft_limit_a: 40000.0
  # ip_error_hard_limit_a: 50000.0
  # ip_error_boundary_penalty_shape: huber
  # ip_error_boundary_huber_delta: 1.0
  # ip_error_boundary_penalty_cap: 4.0
  # r_score: 0.10
  # z_score: 0.10
  topology_score: 0.2
  ip_error_boundary_penalty: 0.2
  # coil_penalty: 1.0
  coil_current_exceed_limit_penalty: -5.0
  # coil_penalty_all_future_steps: true
  # action_l2_penalty: 0.0002
  # action_smooth_penalty: 0.001
  score_lower_bound: false

ppo:
  total_timesteps: 32768000
  n_steps: 256

# --- WandB ---
wandb:
  enabled: true
  project: f1_control
  entity: null
  tags: []