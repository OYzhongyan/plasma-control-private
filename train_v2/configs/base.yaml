# Base config for train_v2 PPO training (Hydra).
#
# 这是共享的全局默认配置。任务级覆盖放在 configs/task/ 下，
# 通过 `task=f1` 或 `task=f2` 选择。其它维度（stage/reward）目前只在此处
# 提供一个默认版本，后续可拆成独立 config group。
#
# 任意嵌套键均可通过命令行点号覆盖，例如：
#   python train_ppo_x.py task=f2 ppo.learning_rate=1e-4 ppo.net_arch=[512,512,256]
#   python train_ppo_x.py task=f1 wandb.enabled=false smoke_rollout=true

defaults:
  - _self_      # 先加载 base 自身内容
  - task: f1    # 默认任务；命令行用 task=f2 切换

# --- 顶层运行参数 ---
task: F1
ports: "2223"
num_envs: 64
max_steps: 300
shot_id: "13844_500"              # shot_groups 为空时的回退 shot
shot_groups: {}
output_dir: baseline
smoke_rollout: false

# reference 目标路径；null -> default_reference_path(task)
target:
  reference_mode: trajectory        # trajectory | hold_initial
  reference_variants_enabled: true
  default_reference_path: null
  reference_variants_path: null

# env 配置路径（相对项目根目录）
env_config: configs/env_default.yaml

# 观测 / 动作
features:
  history_steps: 4  # 保留多少个连续观测组成输入历史
  noise: false
  delay_step: 0  # >0 时启用观测 k 步延迟（第 t 步模型看到 o_{t-k}）
  delay_noise_std: {}  # 观测键 -> 高斯噪声 std，如 {Ip: 1000.0, R: 0.005, Z: 0.005}

actions:
  mode: delta

reward_weights: {}

reset_perturbation:
  enabled: false
  apply_mode: all
  fix_reset_params: false
  signeo_scale_range: [0.9, 1.1]
  bp_scale_range: [0.9, 1.1]
  q0_scale_range: [0.9, 1.1]

# --- PPO ---
ppo:
  total_timesteps: 100000000
  policy: MlpPolicy
  learning_rate: 3.0e-4
  n_steps: 512
  batch_size: 1024
  n_epochs: 6
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03
  use_sde: false
  sde_sample_freq: -1
  net_arch: [256, 256]
  activation_fn: tanh
  log_std_init: -1.0
  verbose: 1
  device: auto
  progress_bar: true
  seed: 0
  lr_anneal: true
  warmup_updates: 10

# --- VecNormalize ---
vecnormalize:
  enabled: true
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
  clip_reward: 10.0
  gamma: null
  epsilon: 1.0e-8
  load_path: null
  save: true

# --- Checkpoint ---
checkpoint:
  enabled: true
  save_freq: 10
  save_vecnormalize: true

# --- Resume ---
resume:
  enabled: false
  model_path: null
  vecnormalize_path: null
  reset_num_timesteps: true

# --- WandB ---
wandb:
  enabled: true
  project: null
  entity: null
  tags: []

# --- Hydra 运行时 ---
# 不 chdir，保留相对路径基于项目根目录；save_dir = ROOT/<run.dir>
hydra:
  job:
    chdir: false
  run:
    dir: results/${now:%Y%m%d_%H%M%S}_${output_dir}
  sweep:
    dir: results/multirun/${now:%Y%m%d_%H%M%S}
    subdir: ${hydra.job.num}
