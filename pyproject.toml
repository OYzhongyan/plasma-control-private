[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-control-environment"
version = "0.1.0"
description = "HFM competition environment for fusion control"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "gymnasium>=0.29",
    "pyyaml>=5.0",
]

[project.optional-dependencies]
baseline = ["stable-baselines3>=2.0", "pyyaml>=5.0", "onnx>=1.16", "torch>=2.0", "hydra-core>=1.3", "wandb", "matplotlib>=3.5", "tensorboard>=2.10", "tqdm>=4.60", "rich>=12", "scipy>=1.9"]
xpt = ["matplotlib>=3.5", "scipy>=1.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["environment*", "train*", "submission*", "eval_files", "evaluation", "evaluation.eval", "evaluation.eval.score"]

[tool.setuptools.package-data]
train = ["configs/*.yaml", "configs/*.json", "targets/*.json"]
