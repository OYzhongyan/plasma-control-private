<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">托卡马克的环向俯视与极向截面示意</title>
  <desc id="desc">左侧展示环形等离子体、中央螺线管、环向磁场及柱坐标；右侧展示真空室、极向场线圈、垂直稳定线圈和磁面截线。线圈位置、数量和尺寸仅为示意。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
    <marker id="greenArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0f766e"/></marker>
    <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172033;font-size:17px}.heading{font-size:21px;font-weight:600}.small{font-size:14px;fill:#536278}.label{font-size:16px}.lead{fill:none;stroke:#64748b;stroke-width:1.5}</style>
  </defs>
