hydra:
  run:
    dir: /inspire/qb-ilm/project/ai-for-fusion/czxs25220173/plasma-control-baseline-20261109/experiments/20261109_f2b_history_smoke_1024_seed0/verification/test/hydra
  sweep:
    dir: results/eval/multirun/${now:%Y%m%d_%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir="/inspire/qb-ilm/project/ai-for-fusion/czxs25220173/plasma-control-baseline-20261109/experiments/20261109_f2b_history_smoke_1024_seed0/verification/test/hydra"
    - hydra.mode=RUN
    task:
    - eval.model_path="/inspire/qb-ilm/project/ai-for-fusion/czxs25220173/plasma-control-baseline-20261109/experiments/20261109_f2b_history_smoke_1024_seed0/training"
    - eval.shots=['13705_500']
    - eval.obs_perturb.enabled=true
    - eval.obs_perturb.delay_steps=1
    - eval.policy_mode=model
    - eval.score=true
    - eval.deterministic=true
    - ports='2223'
    - reset_perturbation.enabled=true
    - reset_perturbation.fix_reset_params=false
    - reset_perturbation.apply_mode=all
    - reset_perturbation.signeo_scale_range=[0.95,1.05]
    - reset_perturbation.bp_scale_range=[0.95,1.05]
    - reset_perturbation.q0_scale_range=[0.95,1.05]
    - wandb.enabled=false
    - eval.seed=300
    - eval.episodes_per_shot=1
    - max_steps=16
  job:
    name: evaluate
    chdir: false
    override_dirname: eval.deterministic=true,eval.episodes_per_shot=1,eval.model_path="/inspire/qb-ilm/project/ai-for-fusion/czxs25220173/plasma-control-baseline-20261109/experiments/20261109_f2b_history_smoke_1024_seed0/training",eval.obs_perturb.delay_steps=1,eval.obs_perturb.enabled=true,eval.policy_mode=model,eval.score=true,eval.seed=300,eval.shots=['13705_500'],max_steps=16,ports='2223',reset_perturbation.apply_mode=all,reset_perturbation.bp_scale_range=[0.95,1.05],reset_perturbation.enabled=true,reset_perturbation.fix_reset_params=false,reset_perturbation.q0_scale_range=[0.95,1.05],reset_perturbation.signeo_scale_range=[0.95,1.05],wandb.enabled=false
    id: ???
    num: ???
    config_name: eval
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /inspire/qb-ilm/project/ai-for-fusion/czxs25220173/plasma-control-baseline-20261109
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /inspire/qb-ilm/project/ai-for-fusion/czxs25220173/plasma-control-baseline-20261109/train/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /inspire/qb-ilm/project/ai-for-fusion/czxs25220173/plasma-control-baseline-20261109/experiments/20261109_f2b_history_smoke_1024_seed0/verification/test/hydra
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
