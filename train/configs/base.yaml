# F2b training configuration.
defaults:
- _self_
ports: '2223'
num_envs: 32
max_steps: 500
shot_id: '15892_400'
shot_groups:
  limiter_start:
  - '15892_400'
  - '15892_500'
output_dir: f2b_direct
smoke_rollout: false
target:
  reference_mode: trajectory
  reference_variants_enabled: false
  default_reference_path: null
  reference_variants_path: null
env_config: configs/env_default.yaml
features:
  observation_mode: reference_only_v1
  history_steps: 0  # Retained for CLI compatibility; no history is appended.
  noise: false
  delay_step: 0
  delay_noise_std: {}
actions:
  mode: absolute
# Official weights/thresholds are taken from evaluation/eval/score/config.py.
# Retained as an empty compatibility node for saved training configurations.
reward_weights: {}
reset_perturbation:
  enabled: true
  apply_mode: all
  fix_reset_params: true
  signeo_scale_range:
  - 0.95
  - 1.05
  bp_scale_range:
  - 0.95
  - 1.05
  q0_scale_range:
  - 0.95
  - 1.05
ppo:
  total_timesteps: 1000000
  policy: MlpPolicy
  learning_rate: 0.0001
  n_steps: 256
  batch_size: 512
  n_epochs: 6
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.03
  use_sde: false
  sde_sample_freq: -1
  net_arch:
  - 256
  - 256
  activation_fn: tanh
  log_std_init: -1.0
  verbose: 1
  device: auto
  progress_bar: true
  seed: 0
  lr_anneal: true
  warmup_updates: 10
vecnormalize:
  enabled: true
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
  clip_reward: 10.0
  gamma: null
  epsilon: 1.0e-08
  load_path: null
  save: true
checkpoint:
  enabled: true
  save_freq: 10
  save_vecnormalize: true
resume:
  enabled: false
  model_path: null
  vecnormalize_path: null
  reset_num_timesteps: true
wandb:
  enabled: true
  project: f2_control
  entity: null
  tags: []
hydra:
  job:
    chdir: false
  run:
    dir: results/${now:%Y%m%d_%H%M%S}_${output_dir}
  sweep:
    dir: results/multirun/${now:%Y%m%d_%H%M%S}
    subdir: ${hydra.job.num}
